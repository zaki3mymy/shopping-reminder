name: CI

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'terraform/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - '.python-version'
      - '.github/workflows/ci.yml'
  # develop / main への push では CD（cd.yml）から呼び出す
  workflow_call:


jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    name: Lint and Format Check

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --dev

    - name: Run ruff check
      run: uv run ruff check

    - name: Run ruff format check
      run: uv run ruff format --check

  type-check:
    runs-on: ubuntu-latest
    name: Type Check

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --dev

    - name: Run mypy
      run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    name: Test

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests
      run: uv run pytest --cov-report=html --cov-report=term

    - name: Upload coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 30

  terraform-validate:
    runs-on: ubuntu-latest
    name: Terraform Validation

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: "~1.9.0"

    - name: Terraform format check
      run: terraform fmt -check -recursive terraform/

    - name: Terraform validate (production)
      run: |
        cd terraform/environments/production
        terraform init -backend=false
        terraform validate

    - name: Terraform validate (dev)
      run: |
        cd terraform/environments/dev
        terraform init -backend=false
        terraform validate

    - name: TFLint
      uses: reviewdog/action-tflint@8de8f6134bd8068970d7261f6b831964df82b92c # v1.29.0
      with:
        github_token: ${{ secrets.github_token }}
        working_directory: terraform/
        tflint_version: "latest"
        tflint_config: "${{ github.workspace }}/terraform/.tflint.hcl"
        flags: "--recursive"

    - name: Terraform Docs Check - Module
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
      with:
        working-dir: terraform/modules/shopping-reminder/
        output-file: README.md
        output-method: inject
        git-push: "false"
        fail-on-diff: "true"

    - name: Terraform Docs Check - Production
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
      with:
        working-dir: terraform/environments/production/
        output-file: README.md
        output-method: inject
        git-push: "false"
        fail-on-diff: "true"

    - name: Terraform Docs Check - Dev
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
      with:
        working-dir: terraform/environments/dev/
        output-file: README.md
        output-method: inject
        git-push: "false"
        fail-on-diff: "true"

  terraform-plan:
    runs-on: ubuntu-latest
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    needs: terraform-validate
    # main（リリース）への PR は本番環境、develop への PR は dev 環境に対して plan する
    environment: ${{ github.base_ref == 'main' && 'prod' || 'develop' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set environment config
      id: config
      run: |
        if [ "${{ github.base_ref }}" = "main" ]; then
          echo "tf_dir=terraform/environments/production" >> $GITHUB_OUTPUT
          echo "state_key=shopping-reminder/terraform.tfstate" >> $GITHUB_OUTPUT
        else
          echo "tf_dir=terraform/environments/dev" >> $GITHUB_OUTPUT
          echo "state_key=shopping-reminder/dev/terraform.tfstate" >> $GITHUB_OUTPUT
        fi

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ap-northeast-1

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: "~1.9.0"

    - name: Terraform Plan
      run: |
        cd ${{ steps.config.outputs.tf_dir }}
        terraform init \
          -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
          -backend-config="key=${{ steps.config.outputs.state_key }}" \
          -backend-config="region=ap-northeast-1"
        terraform plan \
          -var="notion_api_key=${{ secrets.NOTION_API_KEY }}" \
          -var="notion_database_id=${{ secrets.NOTION_DATABASE_ID }}" \
          -var="notify_api_key=${{ secrets.NOTIFY_API_KEY }}" \
          -var="notify_api_url=${{ secrets.NOTIFY_API_URL }}"
