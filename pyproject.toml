[project]
name = "shopping-reminder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
# コードが使うのは opentelemetry-api だけ（Lambda の zip は src/shopping_reminder だけで、依存は含めない）。
# OTel のパッケージは、本番と同じもの（コミュニティの Lambda レイヤー（layer-python）と、自前の計装の
# レイヤー（urllib・logging））をローカルにも入れ、レイヤーと同じバージョンに固定する。
# レイヤーと一緒に .github/workflows/update-otel-lambda-layers.yml が上げる。
# 自前の計装のレイヤー（scripts/build-otel-instrumentations-layer.py）は、uv.lock のバージョンで作る
dependencies = [
    "opentelemetry-distro==0.66b1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-aws-lambda==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
    "opentelemetry-instrumentation-urllib==0.66b1",
]

[tool.uv]
# uv のバージョン。CI（setup-uv）もローカルもこの範囲の uv を使う。
required-version = ">=0.13,<0.14"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.9",
]

# linter / formatter
[tool.ruff]
line-length = 100
indent-width = 4
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.ruff.lint.isort]
known-first-party = ["shopping_reminder"]

# type-checker
[tool.mypy]
check_untyped_defs = true  # 関数の引数/戻り値の型をチェックする
[[tool.mypy.overrides]]
module = ["config", "notion_client", "notify_client", "models", "logger"]
ignore_missing_imports = true

# test
[tool.pytest.ini_options]
pythonpath = [".", "src/shopping_reminder"]
testpaths = ["tests"]
addopts = "--cov src --cov-branch --cov-report term-missing --cov-report xml --cov-report html"
