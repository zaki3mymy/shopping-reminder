# Lambda の Collector レイヤー（opentelemetry-lambda のコミュニティ製）の設定。
# アプリ（Python 計装レイヤー）からトレース・メトリクス・ログを OTLP で受けて、Grafana Cloud に otlphttp で送る。
# 送信先と Authorization ヘッダーの値は、Lambda の環境変数で渡す（terraform/modules/shopping-reminder/main.tf）。
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317
      http:
        endpoint: localhost:4318
  # Lambda の Telemetry API から、実行環境の初期化（コールドスタート）の開始と終了を受け取り、
  # "init <関数名>" という span（faas.coldstart=true）を作る。トレースだけで使う
  telemetryapi:

processors:
  # telemetryapi が作った初期化の span を、そのとき呼ばれた実行（ハンドラー）と同じトレースに入れる。
  # 実行の span を faas.invocation_id で見分け、初期化の span を faas.coldstart で見分けるので、
  # アプリの span に faas.coldstart を付けてはいけない
  coldstart:
  # Grafana Cloud に出したくない属性を消す
  #   - http.url・url.full: urllib の計装が、HTTP クライアントの span とメトリクスのラベルに付ける。
  #     Notion のデータベース ID と、通知先（なんでもお知らせくん）の API Gateway のホストが入る。
  #     url.full は新しいセマンティック規約（OTEL_SEMCONV_STABILITY_OPT_IN=http）での名前
  #   - cloud.account.id: AWS のアカウント ID（Lambda の計装が実行の span に付ける）
  #   - cloud.resource_id: 関数の ARN（アカウント ID を含む。同上）
  # faas.invocation_id は coldstart processor が使うので消さない
  attributes/redact:
    actions:
      - key: http.url
        action: delete
      - key: url.full
        action: delete
      - key: cloud.account.id
        action: delete
      - key: cloud.resource_id
        action: delete
  # リソースの属性にも付くことがあるので、同じく消す
  resource/redact:
    attributes:
      - key: cloud.account.id
        action: delete
      - key: cloud.resource_id
        action: delete
  # ログの本文で、トレースやメトリクスでは消している値を伏せる（本文はアプリのまま送るため、
  # 属性のように消せない）。CloudWatch Logs には元のまま出る。
  #   - ARN の中の AWS のアカウント ID（例: EventBridge のイベントのルールの ARN）
  #   - EventBridge のイベントの "account"（AWS のアカウント ID）
  #   - 通知先（なんでもお知らせくん）の API Gateway のホスト
  #   - Notion のデータベース ID（Lambda の環境変数の値と同じ文字列。Notion の URL にも入る）
  # error_mode: ignore なので、置き換えに失敗してもログは落とさずに送る。
  # $$ は Collector の設定の $ のエスケープ（"$${1}" は OTTL には "${1}"、つまり 1 番目のキャプチャーとして渡る）
  transform/redact_log_body:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "(arn:aws[a-z-]*:[a-z0-9-]+:[a-z0-9-]*:)[0-9]{12}", "$${1}***")
          - replace_pattern(body, "(\"account\":\\s*\")[0-9]{12}\"", "$${1}***\"")
          - replace_pattern(body, "[a-z0-9]+\\.execute-api\\.[a-z0-9-]+\\.amazonaws\\.com", "***")
          - replace_pattern(body, "${env:NOTION_DATABASE_ID}", "***")
  # Lambda の応答を返してから送るようにする（実行の終わりに Grafana Cloud への送信を待たない）。
  # 送り終わるまで実行環境は止められない。パイプラインの最後に置く
  decouple:

exporters:
  otlphttp/grafana_cloud:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:GRAFANA_CLOUD_OTLP_AUTH}

service:
  pipelines:
    traces:
      receivers: [otlp, telemetryapi]
      processors: [coldstart, attributes/redact, resource/redact, decouple]
      exporters: [otlphttp/grafana_cloud]
    metrics:
      receivers: [otlp]
      processors: [attributes/redact, resource/redact, decouple]
      exporters: [otlphttp/grafana_cloud]
    # アプリの logging のログ（opentelemetry-instrumentation-logging が OTel のログにする）。
    # Grafana Cloud では Loki に入り、トレース ID・span ID でトレースと紐づく
    logs:
      receivers: [otlp]
      processors: [resource/redact, transform/redact_log_body, decouple]
      exporters: [otlphttp/grafana_cloud]
